name: validate & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Zero-dependency: no pip install step on purpose.
      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Check catalog is current
        run: python scripts/generate_catalog.py --check

      - name: Build distribution zips
        run: python scripts/build_dist.py

      - name: Upload build artifacts (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: mind-palace-dist
          path: dist/**

      - name: Attach to GitHub Release (tags only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mind-palace-skills.zip
            dist/kits/*.zip
            dist/skills/*.zip
