<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="mind-palace-agent-skills — Ingest your GitHub. Witness the week. Grow a palace.">
  <rect width="1280" height="340" fill="#09090b"/>

  <!-- left: concentric rings of room dots around a central gold pulse -->
  <g transform="translate(300 170)">
    <!-- slow rotating outer ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      <g fill="#9aa1ad" opacity="0.55">
        <circle cx="0" cy="-150" r="3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
        <circle cx="106" cy="-106" r="3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" begin="0.5s" repeatCount="indefinite"/></circle>
        <circle cx="150" cy="0" r="3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
        <circle cx="106" cy="106" r="3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
        <circle cx="0" cy="150" r="3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
        <circle cx="-106" cy="106" r="3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" begin="2.5s" repeatCount="indefinite"/></circle>
        <circle cx="-150" cy="0" r="3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
        <circle cx="-106" cy="-106" r="3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" begin="3.5s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- middle ring: violet accents, staggered fade-in -->
    <g fill="#c9b6ff">
      <circle cx="0" cy="-95" r="3.5" opacity="0"><animate attributeName="opacity" values="0;0.85;0.4;0.85" dur="7s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="82" cy="48" r="3.5" opacity="0"><animate attributeName="opacity" values="0;0.85;0.4;0.85" dur="7s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="-82" cy="48" r="3.5" opacity="0"><animate attributeName="opacity" values="0;0.85;0.4;0.85" dur="7s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="95" cy="-30" r="2.5" opacity="0"><animate attributeName="opacity" values="0;0.6;0.3;0.6" dur="7s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="-95" cy="-30" r="2.5" opacity="0"><animate attributeName="opacity" values="0;0.6;0.3;0.6" dur="7s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="95" r="2.5" opacity="0"><animate attributeName="opacity" values="0;0.6;0.3;0.6" dur="7s" begin="2.7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- inner ring: gold dots -->
    <g fill="#f4c97a">
      <circle cx="0" cy="-46" r="3" opacity="0"><animate attributeName="opacity" values="0;0.9;0.5;0.9" dur="5s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="23" r="3" opacity="0"><animate attributeName="opacity" values="0;0.9;0.5;0.9" dur="5s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="-40" cy="23" r="3" opacity="0"><animate attributeName="opacity" values="0;0.9;0.5;0.9" dur="5s" begin="1.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- central gold pulse -->
    <circle cx="0" cy="0" r="9" fill="#f4c97a">
      <animate attributeName="r" values="7;10;7" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#f4c97a" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="9;40" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- right: wordmark + tagline -->
  <g transform="translate(560 0)">
    <text x="0" y="158" fill="#ecedf1" font-family="'Geist Mono','SFMono-Regular',ui-monospace,Menlo,monospace" font-size="42" font-weight="600" letter-spacing="-1">mind-palace-agent-skills</text>
    <text x="2" y="200" fill="#9aa1ad" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="20" letter-spacing="0.2">Ingest your GitHub. Witness the week. Grow a palace.</text>
    <rect x="2" y="222" width="64" height="2" fill="#f4c97a" opacity="0.85"/>
    <rect x="74" y="222" width="20" height="2" fill="#c9b6ff" opacity="0.7"/>
  </g>
</svg>
